  file: ccg30_22_rank_bm25rescue_10.yaml
  rationale: Reduce the BM25 rescue set passed into reranking.
  overrides:
    ranking:
      reranker:
        bm25_rescue_top_k: 10
- name: ccg30_23_rank_bm25rescue_20
  file: ccg30_23_rank_bm25rescue_20.yaml
  rationale: Increase the BM25 rescue set passed into reranking.
  overrides:
    ranking:
      reranker:
        bm25_rescue_top_k: 20
- name: ccg30_24_rank_topm_25
  file: ccg30_24_rank_topm_25.yaml
  rationale: Rerank a smaller candidate set.
  overrides:
    ranking:
      reranker:
        top_m: 25
- name: ccg30_25_rank_topm_45
  file: ccg30_25_rank_topm_45.yaml
  rationale: Rerank a larger candidate set.
  overrides:
    ranking:
      reranker:
        top_m: 45
- name: ccg30_26_rank_gate_margin_015
  file: ccg30_26_rank_gate_margin_015.yaml
  rationale: Loosen reranker gating margin.
  overrides:
    ranking:
      reranker:
        gating:
          threshold_margin: 0.15
- name: ccg30_27_rank_gate_margin_025
  file: ccg30_27_rank_gate_margin_025.yaml
  rationale: Tighten reranker gating margin.
  overrides:
    ranking:
      reranker:
        gating:
          threshold_margin: 0.25
