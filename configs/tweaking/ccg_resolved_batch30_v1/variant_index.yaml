        max_additions: 4
      coverage_recovery:
        max_additions: 4
      post_merge_candidates: 60
- name: ccg30_29_combo_context_conservative
  file: ccg30_29_combo_context_conservative.yaml
  rationale: Conservative context regime with tighter gates and lower rescue allowance.
  overrides:
    context:
      dynamic_budget_max_expansions: 1
      relevance_gate_threshold: 0.3
      unresolved_evidence_injection_max_blocks: 1
- name: ccg30_30_combo_context_aggressive
  file: ccg30_30_combo_context_aggressive.yaml
  rationale: Aggressive context regime with broader expansion and stronger rescue
    allowance.
  overrides:
    context:
      dynamic_budget_max_expansions: 3
      relevance_gate_threshold: 0.2
      unresolved_evidence_injection_max_blocks: 3
