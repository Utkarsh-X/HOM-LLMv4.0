base_config: tuning/resolved_configs/ccg_v2_ab_budget5200_weights_dynamic_budget.resolved.yaml
variants:
- name: ccg30_01_baseline
  file: ccg30_01_baseline.yaml
  rationale: Resolved winning CCG config with all fallback defaults materialized.
  overrides: {}
- name: ccg30_02_ret_precision_add2
  file: ccg30_02_ret_precision_add2.yaml
  rationale: Reduce precision recovery additions below the resolved baseline.
  overrides:
    retrieval:
      precision_recovery:
        max_additions: 2
- name: ccg30_03_ret_precision_add4
  file: ccg30_03_ret_precision_add4.yaml
  rationale: Increase precision recovery additions above the resolved baseline.
  overrides:
    retrieval:
      precision_recovery:
        max_additions: 4
- name: ccg30_04_ret_precision_scan6
  file: ccg30_04_ret_precision_scan6.yaml
  rationale: Narrow the precision recovery scan window.
  overrides:
    retrieval:
      precision_recovery:
        scan_candidates: 6
- name: ccg30_05_ret_precision_scan10
  file: ccg30_05_ret_precision_scan10.yaml
  rationale: Widen the precision recovery scan window.
  overrides:
    retrieval:
      precision_recovery:
        scan_candidates: 10
- name: ccg30_06_ret_precision_conf075
  file: ccg30_06_ret_precision_conf075.yaml
  rationale: Loosen precision recovery confidence threshold.
  overrides:
    retrieval:
      precision_recovery:
        min_confidence: 0.75
- name: ccg30_07_ret_precision_conf085
  file: ccg30_07_ret_precision_conf085.yaml
  rationale: Tighten precision recovery confidence threshold.
  overrides:
    retrieval:
      precision_recovery:
        min_confidence: 0.85
- name: ccg30_08_ret_coverage_add2
  file: ccg30_08_ret_coverage_add2.yaml
  rationale: Reduce coverage recovery insertions.
  overrides:
    retrieval:
      coverage_recovery:
        max_additions: 2
- name: ccg30_09_ret_coverage_add4
  file: ccg30_09_ret_coverage_add4.yaml
  rationale: Increase coverage recovery insertions.
  overrides:
    retrieval:
      coverage_recovery:
        max_additions: 4
- name: ccg30_10_ret_postmerge_40
  file: ccg30_10_ret_postmerge_40.yaml
  rationale: Shrink the post-merge candidate surface.
  overrides:
    retrieval:
      post_merge_candidates: 40
- name: ccg30_11_ret_postmerge_60
  file: ccg30_11_ret_postmerge_60.yaml
  rationale: Expand the post-merge candidate surface.
  overrides:
    retrieval:
      post_merge_candidates: 60
- name: ccg30_12_ctx_dynstep_300
  file: ccg30_12_ctx_dynstep_300.yaml
  rationale: Use a smaller dynamic budget expansion step.
  overrides:
    context:
      dynamic_budget_step_tokens: 300
- name: ccg30_13_ctx_dynstep_500
  file: ccg30_13_ctx_dynstep_500.yaml
  rationale: Use a larger dynamic budget expansion step.
  overrides:
    context:
      dynamic_budget_step_tokens: 500
- name: ccg30_14_ctx_dynexp_1
  file: ccg30_14_ctx_dynexp_1.yaml
  rationale: Limit dynamic budget to a single expansion.
  overrides:
    context:
      dynamic_budget_max_expansions: 1
- name: ccg30_15_ctx_dynexp_3
  file: ccg30_15_ctx_dynexp_3.yaml
  rationale: Allow one more dynamic budget expansion than the resolved baseline.
  overrides:
    context:
      dynamic_budget_max_expansions: 3
- name: ccg30_16_ctx_relgate_020
  file: ccg30_16_ctx_relgate_020.yaml
  rationale: Loosen the relevance gate to admit weaker blocks.
  overrides:
    context:
      relevance_gate_threshold: 0.2
- name: ccg30_17_ctx_relgate_030
  file: ccg30_17_ctx_relgate_030.yaml
  rationale: Tighten the relevance gate to reject weaker blocks.
  overrides:
    context:
      relevance_gate_threshold: 0.3
- name: ccg30_18_ctx_graph_015
  file: ccg30_18_ctx_graph_015.yaml
  rationale: Reduce graph weight and return that mass to RRF.
  overrides:
    context:
      submodular:
        w_rrf: 0.6
        w_graph: 0.15
- name: ccg30_19_ctx_graph_025
  file: ccg30_19_ctx_graph_025.yaml
  rationale: Increase graph weight and reduce RRF slightly.
  overrides:
    context:
      submodular:
        w_rrf: 0.5
        w_graph: 0.25
- name: ccg30_20_ctx_unresblocks_1
  file: ccg30_20_ctx_unresblocks_1.yaml
  rationale: Make unresolved evidence injection more conservative.
  overrides:
    context:
      unresolved_evidence_injection_max_blocks: 1
- name: ccg30_21_ctx_unresblocks_3
  file: ccg30_21_ctx_unresblocks_3.yaml
  rationale: Make unresolved evidence injection more aggressive.
  overrides:
    context:
      unresolved_evidence_injection_max_blocks: 3
