# ==========================================================================
# API Keys Configuration Template
# ==========================================================================
# 
# SETUP INSTRUCTIONS:
# 1. Copy this file to 'secrets.yaml' in the same directory:
#    cp configs/secrets.example.yaml configs/secrets.yaml
#
# 2. Replace the placeholder values with your actual API keys
#
# 3. The secrets.yaml file is gitignored and will not be committed
#
# ALTERNATIVE: You can still use environment variables:
#   - GEMINI_API_KEY for Gemini
#   - OPENAI_API_KEY for OpenAI
#
# Priority: secrets.yaml > environment variables
# ==========================================================================

api_keys:
  # Google Gemini API key
  # Get yours at: https://aistudio.google.com/app/apikey
  gemini: "your_gemini_api_key_here"
  
  # OpenAI API key (optional)
  # Get yours at: https://platform.openai.com/api-keys
  openai: "your_openai_api_key_here"
  
  # Anthropic API key (optional, for future use)
  # anthropic: "your_anthropic_api_key_here"
