indexer:
  languages:
  - python
  - javascript
  - typescript
  ignore_patterns:
  - .git
  - node_modules
  - __pycache__
  - '*.pyc'
  - .venv
  chunk_max_lines: 100
  embedding_model: Qwen/Qwen3-Embedding-0.6B
  embedding_dimension: 1024
  embedding_max_tokens: 1024
  storage:
    duckdb_path: indexes/metadata.duckdb
    tantivy_path: indexes/bm25.index
    lancedb_path: indexes/vectors.lance
    artifacts_path: indexes
  entity_centric_indexing_enabled: true
  type_alias_extraction_enabled: false
  entity_confidence:
    public_name_bonus: 0.3
    docstring_bonus: 0.4
    exported_bonus: 0.2
    type_annotated_bonus: 0.1
    cap_at: 1.0
  hierarchical_chunking:
    enabled: true
    fine_enabled: true
    medium_enabled: true
    coarse_enabled: true
    chunk_max_lines: 100
retrieval:
  bm25:
    engine: tantivy
    top_k: 50
  vector:
    engine: lancedb
    top_k: 50
    calibration_mode: legacy
  hybrid:
    method: rrf
    rrf_k: 10
  parallel_search:
    enabled: true
  static_ceiling_experiment:
    enabled: false
    branch_multiplier: 2
    post_merge_multiplier: 2
    output_multiplier: 2
  precision_recovery:
    enabled: true
    max_additions: 3
    max_ratio: 0.2
    scan_candidates: 8
    identifier_limit: 16
    bm25_top_k: 5
    vector_top_k: 3
    min_confidence: 0.8
  query_expansion:
    enabled: true
    max_terms: 6
    min_token_length: 3
    synonyms:
      auth:
      - authentication
      - authorize
      - authorization
      - login
      authentication:
      - auth
      - authorize
      - authorization
      - login
      login:
      - signin
      - authentication
      - auth
      signin:
      - login
      - authentication
      - auth
      function:
      - method
      - routine
      - handler
      method:
      - function
      - routine
      module:
      - package
      - file
      - component
      bug:
      - issue
      - error
      - failure
      fix:
      - repair
      - patch
      - resolve
      import:
      - dependency
      - module
      resolve:
      - resolution
      - lookup
      cache:
      - caching
      - memoization
  post_merge_candidates: 50
  expansion:
    enabled: true
    max_additions: 4
    min_similarity: 0.25
  plan_b_enabled: true
  diversity_mmr:
    enabled: true
    lambda: 0.6
    similarity_threshold: 0.85
  granularity_boost:
    enabled: true
    EXPLAIN:
      coarse: 2.0
      medium: 1.5
      fine: 1.0
    IMPLEMENT:
      fine: 2.0
      medium: 1.2
      coarse: 0.8
    REFACTOR:
      fine: 1.8
      medium: 1.5
      coarse: 1.0
    DEBUG:
      fine: 2.5
      medium: 1.5
      coarse: 1.0
    SEARCH:
      medium: 1.8
      fine: 1.5
      coarse: 1.0
  graph_stitch:
    enabled: true
    max_depth: 2
    max_additions: 8
    min_confidence: 0.5
    graph_cache_enabled: true
    graph_stitch_beam_high: 8
    graph_stitch_beam_low: 3
    relation_priority:
    - calls
    - overrides
    - imports
    - uses
    - inherits
    - type_annotates
  granularity_mixing:
    enabled: true
    profiles:
      EXPLAIN:
        fine:
          min: 3
          max: 8
        medium:
          min: 2
          max: 6
        coarse:
          min: 1
          max: 4
      IMPLEMENT:
        fine:
          min: 8
          max: 15
        medium:
          min: 1
          max: 4
        coarse:
          min: 0
          max: 1
      DEBUG:
        fine:
          min: 10
          max: 18
        medium:
          min: 1
          max: 3
        coarse:
          min: 0
          max: 1
      SEARCH:
        fine:
          min: 2
          max: 5
        medium:
          min: 3
          max: 8
        coarse:
          min: 2
          max: 5
      REFACTOR:
        fine:
          min: 6
          max: 12
        medium:
          min: 2
          max: 5
        coarse:
          min: 1
          max: 2
      UNKNOWN:
        fine:
          min: 5
          max: 10
        medium:
          min: 2
          max: 5
        coarse:
          min: 1
          max: 2
ranking:
  graph_proximity:
    max_depth: 4
    anchor_k: 5
  dedup:
    file_entropy_threshold: 0.6
  phase2:
    enabled: true
    adaptive_weights_enabled: true
  two_pass:
    enabled: true
    seed_k: 20
    max_depth: 3
    decay: 0.8
  mmr_selection:
    enabled: true
    top_n: 50
    lambda: 0.85
  set_optimization:
    enabled: false
    token_budget: 3200
    w_relevance: 1.0
    w_structural: 0.6
    w_coverage: 0.8
    w_redundancy: 0.5
    w_dispersion: 0.2
  reranker:
    enabled: true
    model: tomaarsen/Qwen3-Reranker-0.6B-seq-cls
    top_m: 40
    gating:
      enabled: false
      threshold_margin: 0.2
      threshold_entropy: 0.7
      threshold_disagreement: 0.5
      top_k: 50
      min_candidates: 3
  weights:
    w_base: 0.4
    w_rerank: 0.55
    w_struct: 0.05
    w_bm25: 0.4
    w_dense: 0.4
    w_name: 0.2
    struct:
      entrypoint_bonus: 0.1
      decorator_bonus: 0.05
      callgraph_bonus: 0.05
      bonus_cap: 0.2
context:
  max_tokens: 4000
  generation_reserve_tokens: 800
  budget_mode: adaptive
  summarization_enabled: false
  ordering: structural_first
  structural_priority_multiplier: 1.5
  scoring_weights:
    w_semantic: 0.4
    w_name: 0.2
    w_structural: 0.0
    w_novelty: 0.0
    w_coherence: 0.0
  structural_priority_entrypoint_bonus: 0.5
  structural_priority_decorator_bonus: 0.3
  structural_priority_callgraph_bonus: 0.2
  structural_priority_cap: 1.0
  coherence_same_file_bonus: 0.8
  coherence_different_file_bonus: 0.5
intelligence:
  enabled: true
  level1_enabled: true
  level2_enabled: true
  level3_enabled: true
  mechanical_fixer_enabled: true
  action_priority:
  - GRAPH_STITCH_RETRY
  - SYMBOL_BACKFILL
  - SEMANTIC_DEDUP_FORCE
  - UTILIZATION_EXPAND
  thresholds:
    orphan_pct_trigger: 60
    redundancy_cluster_pct_trigger: 25
    used_budget_pct_low: 40
  caps:
    graph_stitch_max: 6
    symbol_backfill_max: 4
    utilization_expand_max: 10
  abrm_enabled: true
  abrm_disable_on_cold_start: false
  p2_budget_increase_pct: 40
generation:
  default_provider: gemini
  default_model: gemini-2.5-flash
  temperature: 0.0
  max_output_tokens: 12000
evaluation:
  judge_model: gemini-2.5-flash
  metrics:
  - semantic_correctness
  - factual_accuracy
  - completeness
  artifact_retention_days: 90
