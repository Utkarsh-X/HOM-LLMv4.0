indexer:
  languages:
  - python
  - javascript
  - typescript
  ignore_patterns:
  - .git
  - node_modules
  - __pycache__
  - '*.pyc'
  - .venv
  - tests/**
  - '**/tests/**'
  - '**/test_*.py'
  - tmp_*
  - '**/tmp_*'
  - '**/tmp_*.py'
  - diagnose_*
  - '**/diagnose_*'
  - debug_*
  - '**/debug_*'
  - diagnostics/**
  - '**/diagnostics/**'
  - scripts/diagnose_*
  chunk_max_lines: 100
  embedding_model: Qwen/Qwen3-Embedding-0.6B
  embedding_dimension: 1024
  embedding_max_tokens: 1024
  embedding_device: auto
  storage:
    duckdb_path: indexes/metadata.duckdb
    tantivy_path: indexes/bm25.index
    lancedb_path: indexes/vectors.lance
    artifacts_path: indexes
retrieval:
  bm25:
    engine: tantivy
    top_k: 50
  vector:
    engine: lancedb
    top_k: 50
    calibration_mode: legacy
  hybrid:
    method: rrf
    rrf_k: 10
  parallel_search:
    enabled: true
  post_merge_candidates: 50
  expansion:
    enabled: true
    max_additions: 4
    min_similarity: 0.25
  adaptive_seed:
    enabled: true
    min_k: 20
    max_k: 150
    drop_threshold: 0.3
  plan_b_enabled: true
  diversity_mmr:
    enabled: false
    lambda: 0.6
    similarity_threshold: 0.85
  graph_stitch:
    enabled: true
ranking:
  concentration_top_k: 10
  dedup:
    file_entropy_threshold: 0.6
  phase2:
    enabled: true
    adaptive_weights_enabled: true
  two_pass:
    enabled: true
    seed_k: 20
    max_depth: 3
    decay: 0.8
  mmr_selection:
    enabled: true
    top_n: 50
    lambda: 0.85
  set_optimization:
    enabled: false
    token_budget: 8000
    max_rounds: 100
    w_relevance: 1.0
    w_structural: 0.6
    w_coverage: 0.8
    w_redundancy: 0.5
    w_dispersion: 0.2
  reranker:
    enabled: true
    model: tomaarsen/Qwen3-Reranker-0.6B-seq-cls
    device: auto
    top_m: 35
    bm25_rescue_top_k: 15
  geometry:
    rerank_alpha: 0.32
    struct_gamma: 0.05
  weights:
    w_base: 1.0
    w_rerank: 0.32
    w_struct: 0.05
    w_bm25: 0.4
    w_dense: 0.4
    w_name: 0.2
context:
  max_tokens: 6000
  generation_reserve_tokens: 800
  budget_mode: adaptive
  summarization_enabled: false
  ordering: structural_first
  ranking_surface_lock_enabled: true
  coherence_enabled: true
  submodular_packer_enabled: true
  submodular:
    w_rrf: 0.55
    w_novelty: 0.05
    w_graph: 0.20
    w_concept: 0.20
    min_density_epsilon: 0.0003
  relevance_gate_enabled: true
  relevance_gate_threshold: 0.25
  low_value_suppression_enabled: false
  low_value_suppression_min_keep_blocks: 18
  claim_gain_swap_enabled: true
  claim_gain_swap_score_epsilon: 0.08
  claim_gain_swap_max_swaps: 4
  claim_gain_swap_min_relevance_floor: 0.15
  unresolved_evidence_injection_enabled: true
  unresolved_evidence_injection_max_blocks: 2
  unresolved_evidence_injection_min_claim_gain: 0.1
  unresolved_evidence_injection_relevance_floor: 0.15
  unresolved_evidence_injection_max_token_share: 0.15
  unresolved_evidence_injection_replace_from_tail: true
intelligence:
  enabled: true
  level1_enabled: true
  level2_enabled: true
  level3_enabled: true
  mechanical_fixer_enabled: true
  abrm_enabled: false
  p2_budget_increase_pct: 40
  claim_coverage:
    enabled: true
    prompt_contract_enabled: false
    required_coverage_threshold: 0.7
    claim_cover_threshold: 0.55
    soft_recovery_enabled: true
    max_recovery_passes: 1
    max_required_claims: 8
    recovery_top_k: 20
generation:
  default_provider: gemini
  default_model: gemini-2.5-flash
  temperature: 0.15
  max_output_tokens: 12000
evaluation:
  cqi_hard_gate_enabled: false
