# Default configuration for HOM-LLM

indexer:
  languages:
    - python
    - javascript
    - typescript
  ignore_patterns:
    - ".git"
    - "node_modules"
    - "__pycache__"
    - "*.pyc"
    - ".venv"
    # Investigation/debug scaffolding exclusions
    - "tests/**"
    - "**/tests/**"
    - "**/test_*.py"
    - "tmp_*"
    - "**/tmp_*"
    - "**/tmp_*.py"
    - "diagnose_*"
    - "**/diagnose_*"
    - "debug_*"
    - "**/debug_*"
    - "diagnostics/**"
    - "**/diagnostics/**"
    - "scripts/diagnose_*"
  chunk_max_lines: 100
  embedding_model: "Qwen/Qwen3-Embedding-0.6B"
  embedding_dimension: 1024
  embedding_max_tokens: 1024
  embedding_device: "auto"  # auto|cuda|cpu
  storage:
    duckdb_path: "indexes/metadata.duckdb"
    tantivy_path: "indexes/bm25.index"
    lancedb_path: "indexes/vectors.lance"
    artifacts_path: "indexes"
  
  # ==========================================================================
  # Entity-Centric Indexing (Plan A)
  # ==========================================================================
  
  # Feature flags
  entity_centric_indexing_enabled: true
  type_alias_extraction_enabled: false  # Keep disabled by default (low-frequency)
  
  # Entity confidence scoring (deterministic, config-driven)
  # All weights must come from config, not hardcoded
  entity_confidence:
    public_name_bonus: 0.3      # No leading underscore
    docstring_bonus: 0.4        # Has docstring
    exported_bonus: 0.2         # In __all__ or re-exported
    type_annotated_bonus: 0.1   # Has type annotation
    cap_at: 1.0                 # Maximum confidence score
  
  # Hierarchical chunking (3-level)
  hierarchical_chunking:
    enabled: true
    fine_enabled: true          # Symbol-level (functions, methods)
    medium_enabled: true        # File sections / logical blocks
    coarse_enabled: true        # File-level summary
    chunk_max_lines: 100        # Deterministic line cap per emitted chunk

retrieval:
  bm25:
    engine: tantivy
    top_k: 50
  vector:
    engine: lancedb
    top_k: 50
    calibration_mode: legacy
  hybrid:
    method: rrf
    rrf_k: 10
  parallel_search:
    enabled: true
  static_ceiling_experiment:
    enabled: false
    branch_multiplier: 2
    post_merge_multiplier: 2
    output_multiplier: 2
  precision_recovery:
    enabled: true
    max_additions: 3
    max_ratio: 0.2
    scan_candidates: 8
    identifier_limit: 16
    bm25_top_k: 5
    vector_top_k: 3
    min_confidence: 0.8
  query_expansion:
    enabled: true
    max_terms: 6
    min_token_length: 3
    synonyms:
      auth: [authentication, authorize, authorization, login]
      authentication: [auth, authorize, authorization, login]
      login: [signin, authentication, auth]
      signin: [login, authentication, auth]
      function: [method, routine, handler]
      method: [function, routine]
      module: [package, file, component]
      bug: [issue, error, failure]
      fix: [repair, patch, resolve]
      import: [dependency, module]
      resolve: [resolution, lookup]
      cache: [caching, memoization]
  post_merge_candidates: 50
  expansion:
    enabled: true
    max_additions: 4
    min_similarity: 0.25
  
  # ==========================================================================
  # Tier 3B: Adaptive Retrieval Geometry
  # ==========================================================================
  adaptive_seed:
    enabled: true
    min_k: 20
    max_k: 150
    drop_threshold: 0.30
  
  # ==========================================================================
  # Plan B: Retrieval Layer Activation
  # ==========================================================================
  
  plan_b_enabled: true
  
  # Diversity-aware MMR (post-RRF redundancy elimination)
  # DISABLED: Diversity is now handled solely by the ranking set optimizer
  # (richer signals). Retrieval-level MMR was double-enforcing diversity.
  diversity_mmr:
    enabled: false
    lambda: 0.6  # Trade-off: 1.0 = relevance only, 0.0 = diversity only
    similarity_threshold: 0.85  # Penalize if similarity exceeds this
  
  # Intent-driven granularity boosting (multiplicative adjustments)
  granularity_boost:
    enabled: true
    EXPLAIN:
      coarse: 2.0
      medium: 1.5
      fine: 1.0
    IMPLEMENT:
      fine: 2.0
      medium: 1.2
      coarse: 0.8
    REFACTOR:
      fine: 1.8
      medium: 1.5
      coarse: 1.0
    DEBUG:
      fine: 2.5
      medium: 1.5
      coarse: 1.0
    SEARCH:
      medium: 1.8
      fine: 1.5
      coarse: 1.0
  
  # Graph-based structural expansion (GRAPH_STITCH)
  graph_stitch:
    enabled: true
    max_depth: 2
    max_additions: 8
    min_confidence: 0.5
    graph_cache_enabled: true
    graph_stitch_beam_high: 8
    graph_stitch_beam_low: 3
    relation_priority:
      - calls
      - overrides
      - imports
      - uses
      - inherits
      - type_annotates
  granularity_mixing:
    enabled: true
    profiles:
      EXPLAIN:
        fine: { min: 3, max: 8 }
        medium: { min: 2, max: 6 }
        coarse: { min: 1, max: 4 }
      IMPLEMENT:
        fine: { min: 8, max: 15 }
        medium: { min: 1, max: 4 }
        coarse: { min: 0, max: 1 }
      DEBUG:
        fine: { min: 10, max: 18 }
        medium: { min: 1, max: 3 }
        coarse: { min: 0, max: 1 }
      SEARCH:
        fine: { min: 2, max: 5 }
        medium: { min: 3, max: 8 }
        coarse: { min: 2, max: 5 }
      REFACTOR:
        fine: { min: 6, max: 12 }
        medium: { min: 2, max: 5 }
        coarse: { min: 1, max: 2 }
      UNKNOWN:
        fine: { min: 5, max: 10 }
        medium: { min: 2, max: 5 }
        coarse: { min: 1, max: 2 }

ranking:
  concentration_top_k: 10
  graph_proximity:
    max_depth: 4
    anchor_k: 5
  dedup:
    file_entropy_threshold: 0.6
  phase2:
    enabled: true
    adaptive_weights_enabled: true
  two_pass:
    enabled: true
    seed_k: 20
    max_depth: 3
    decay: 0.8
  mmr_selection:
    enabled: true
    top_n: 50
    lambda: 0.85
  set_optimization:
    enabled: true
    token_budget: 8000  # Stage 2 root-cause pass: reduce pre-context pruning starvation
    max_rounds: 100  # Safety cap (CELF converges naturally, no brute-force scaling)
    w_relevance: 1.0
    w_structural: 0.6
    w_coverage: 0.8
    w_redundancy: 0.5
    w_dispersion: 0.2
  reranker:
    enabled: true
    model: "tomaarsen/Qwen3-Reranker-0.6B-seq-cls"
    device: "auto"  # auto|cuda|cpu
    top_m: 35  # A3: expanded from 20 for better coverage without tripling latency
    bm25_rescue_top_k: 15  # A3: also rerank high-BM25 candidates outside top-M
    gating:
      enabled: false
      threshold_margin: 0.2
      threshold_entropy: 0.7
      threshold_disagreement: 0.5
      top_k: 50
      min_candidates: 3
  # Canonical control surfaces for final score fusion (D1).
  # Formula: final_score = w_base*base + w_rerank*rerank + w_struct*struct
  # Replaces legacy geometry.rerank_alpha / struct_gamma.
  geometry:
    rerank_alpha: 0.32  # deprecated, use weights.w_rerank
    struct_gamma: 0.05  # deprecated, use weights.w_struct
  weights:
    w_base: 1.0    # base score weight (1.0 = additive baseline)
    w_rerank: 0.32 # reranker contribution (was rerank_alpha)
    w_struct: 0.05 # structural bonus weight (was struct_gamma)
    w_bm25: 0.4
    w_dense: 0.4
    w_name: 0.2
    struct:
      entrypoint_bonus: 0.1
      decorator_bonus: 0.05
      callgraph_bonus: 0.05
      bonus_cap: 0.2

context:
  max_tokens: 4400  # Tier 2: Increased from 4000 (effective: 3600 after reserve)
  generation_reserve_tokens: 800  # Tokens reserved for generation output
  budget_mode: adaptive
  summarization_enabled: false
  ordering: "structural_first"
  ranking_surface_lock_enabled: true
  structural_priority_multiplier: 1.5
  scoring_weights:
    w_semantic: 0.4
    w_name: 0.2
    w_structural: 0.0
    w_novelty: 0.0
    w_coherence: 0.1
  structural_priority_entrypoint_bonus: 0.5
  structural_priority_decorator_bonus: 0.3
  structural_priority_callgraph_bonus: 0.2
  structural_priority_cap: 1.0
  coherence_same_file_bonus: 0.8
  coherence_different_file_bonus: 0.5
  # Tier 2: Coherence refinement (post-lock, mid-range only)
  coherence_enabled: true
  coherence_max_contribution: 0.15
  coherence_protect_top_n: 3
  coherence_proximity_lines: 50
  coherence_synergy_threshold: 0.3
  coherence_dispersion_threshold: 0.9
  coherence_callgraph_bonus: 0.1
  # Tier 3B: Submodular context packing
  submodular_packer_enabled: true
  submodular:
    w_rrf: 0.70
    w_novelty: 0.10
    w_graph: 0.05
    w_concept: 0.15
    min_density_epsilon: 0.0003
    novelty_scaling: file_concentration
  # Tier 3B: Relevance safety guard
  relevance_gate_enabled: true
  relevance_gate_threshold: 0.25
  # Tier 3C: Conservative precision filter to reduce low-signal spillover blocks.
  precision_filter_enabled: false
  precision_filter_query_identifier_min: 1
  precision_filter_low_score_threshold: 0.25
  precision_filter_min_kept_blocks: 10
  # Tier 3B: Sufficiency escape hatch (not yet implemented)
  escape_hatch_enabled: false

intelligence:
  enabled: true
  level1_enabled: true
  level2_enabled: true
  level3_enabled: true
  
  # ==========================================================================
  # Plan C: Mechanical Fixer & ABRM
  # ==========================================================================
  
  # Mechanical fixer: single-action, deterministic corrective actions
  mechanical_fixer_enabled: true
  
  # Action priority (highest priority first)
  action_priority:
    - GRAPH_STITCH_RETRY
    - SYMBOL_BACKFILL
    - SEMANTIC_DEDUP_FORCE
    - UTILIZATION_EXPAND
  
  # Thresholds that trigger actions
  thresholds:
    orphan_pct_trigger: 60        # Triggers GRAPH_STITCH_RETRY
    redundancy_cluster_pct_trigger: 25  # Triggers SEMANTIC_DEDUP_FORCE
    used_budget_pct_low: 40       # Triggers UTILIZATION_EXPAND
  
  # Caps for additive actions
  caps:
    graph_stitch_max: 6
    symbol_backfill_max: 4
    utilization_expand_max: 10
  
  # ABRM (Assumption-Bound Reasoning Mode)
  abrm_enabled: false
  abrm_disable_on_cold_start: false
  p2_budget_increase_pct: 40

  # Claim-Coverage Gate (query-agnostic context sufficiency control)
  claim_coverage:
    enabled: false  # Keep off by default until post-coverage context quality gap is fixed
    required_coverage_threshold: 0.70
    claim_cover_threshold: 0.55
    soft_recovery_enabled: true
    max_recovery_passes: 1
    max_required_claims: 8
    recovery_top_k: 20

generation:
  default_provider: gemini
  default_model: "gemini-2.5-flash"
  temperature: 0.15
  max_output_tokens: 12000  # Increased to reduce PARTIAL responses

evaluation:
  judge_model: "gemini-2.5-flash"
  metrics:
    - semantic_correctness
    - factual_accuracy
    - completeness
  artifact_retention_days: 90
