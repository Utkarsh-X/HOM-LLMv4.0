# Default configuration for HOM-LLM

indexer:
  languages:
    - python
    - javascript
    - typescript
  ignore_patterns:
    - ".git"
    - "node_modules"
    - "__pycache__"
    - "*.pyc"
    - ".venv"
  chunk_max_lines: 100
  embedding_model: "Qwen/Qwen3-Embedding-0.6B"
  embedding_dimension: 1024
  storage:
    duckdb_path: "indexes/metadata.duckdb"
    tantivy_path: "indexes/bm25.index"
    lancedb_path: "indexes/vectors.lance"
    artifacts_path: "indexes"

retrieval:
  bm25:
    engine: tantivy
    top_k: 50
  vector:
    engine: lancedb
    top_k: 50
  hybrid:
    method: rrf
    rrf_k: 10
  expansion:
    enabled: true
    max_additions: 4
    min_similarity: 0.25

ranking:
  reranker:
    enabled: true
    model: "Qwen/Qwen3-Reranker-0.6B"
    top_m: 40
  weights:
    w_base: 0.4
    w_rerank: 0.55
    w_struct: 0.05
    w_bm25: 0.4
    w_dense: 0.4
    w_name: 0.2
    struct:
      entrypoint_bonus: 0.1
      decorator_bonus: 0.05
      callgraph_bonus: 0.05
      bonus_cap: 0.2

context:
  max_tokens: 4000
  generation_reserve_tokens: 800  # Tokens reserved for generation output
  budget_mode: adaptive
  summarization_enabled: false
  ordering: "structural_first"
  structural_priority_multiplier: 1.5
  scoring_weights:
    w_semantic: 0.4
    w_name: 0.2
    w_structural: 0.2
    w_novelty: 0.1
    w_coherence: 0.1
  structural_priority_entrypoint_bonus: 0.5
  structural_priority_decorator_bonus: 0.3
  structural_priority_callgraph_bonus: 0.2
  structural_priority_cap: 1.0
  coherence_same_file_bonus: 0.8
  coherence_different_file_bonus: 0.5

intelligence:
  enabled: true
  level1_enabled: true
  level2_enabled: true
  level3_enabled: true

generation:
  default_provider: gemini
  default_model: "gemini-2.5-flash"
  temperature: 0.0
  max_output_tokens: 8000  # Increased for Gemini thinking models

evaluation:
  judge_model: "gemma-3-27b-it"
  metrics:
    - semantic_correctness
    - factual_accuracy
    - completeness
  artifact_retention_days: 90
