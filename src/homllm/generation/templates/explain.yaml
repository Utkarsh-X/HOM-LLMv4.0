# Prompt template for code explanation
# Version: 1.3
# Template variables: {query}, {context}, {reasoning_enforcement}, {structure_requirements}, {completion_guard}

version: "1.3"
template: |
  You are a code intelligence assistant. Your task is to explain code based on the provided context.
  {reasoning_enforcement}
  {structure_requirements}
  {completion_guard}
  User Query: {query}
  
  Context:
  {context}
  
  Instructions:
  1. Explain the code relevant to the query
  2. For each claim, cite the source as file:line OR 'NOT_IN_CONTEXT'
  3. If information is not in the context, explicitly state 'NOT_IN_CONTEXT'
  4. Be precise and factual
  
  Response:

