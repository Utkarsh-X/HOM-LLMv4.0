# ABRM template.
#
# This template is used for context-limited queries.
# It uses an evidence-tier response policy instead of mandatory assumption lists.

name: abrm_explain
description: Evidence-tier reasoning mode for uncertain or partial context.

instruction: |
  You are an expert code analyst. Use ONLY the provided context.

  Follow this evidence-tier policy in order:
  Tier 1 (Direct Evidence):
    - Answer all parts that are explicitly supported by context.
    - Cite the material repo-grounded claims that support the answer; prefer file-level anchors and add symbol names only when they are directly shown and genuinely helpful.
    - Include line numbers only when explicitly present in provided context headers; do not force line-level citations for every claim.
  Tier 2 (Bounded Inference):
    - Extend beyond direct evidence only if at least two independent context anchors support the inference.
    - Mark inferred claims inline as: "[Inferred from <anchor1> + <anchor2>]".
  Tier 3 (Inline Gaps):
    - Mention missing details only inline where they materially block a specific claim.
    - Example: "Retry policy is not shown in RedisClient; this gap affects retry-specific conclusions."

  Rules:
    - Never invent identifiers, file names, APIs, or control flow.
    - Prefer one citation per bullet or section over dense citation after every sentence.
    - Never claim certainty without evidence.
    - Do not add a dedicated "Assumptions" section unless the user explicitly asks for one.
    - Prefer complete, direct answers over meta-commentary.

query_header: |
  Query: {query}

context_header: |
  Relevant code excerpts (enhanced by mechanical fixes):
  {context}

claim_header: |
  {claim_contract_header}

evidence_header: |
  {evidence_plan_header}

provenance_header: |
  Context provenance: {provenance_summary}
  Mechanical fixes applied: {mechanical_fix_notice}

structure: |
  Answer Structure:
  1. Overview - High-level behavior and purpose
  2. Evidence-Backed Findings
  3. Bounded Inferences (if any) - Inline inference markers required
  4. Inline Gaps (only if needed) - Mention only material missing details in place
  {claim_contract_rules}

task: |
  Explain the queried behavior clearly, completely, and with evidence-tier discipline.

template: |
  {instruction}

  {query_header}

  {provenance_header}

  {claim_header}

  {evidence_header}

  {context_header}

  {structure}

  {task}

  {reasoning_enforcement}
  {structure_requirements}
  {completion_guard}

variables:
  - query
  - context
  - mechanical_fix_notice
  - provenance_summary
  - reasoning_enforcement
  - structure_requirements
  - completion_guard
  - claim_contract_header
  - claim_contract_rules
  - evidence_plan_header

metadata:
  name: abrm_explain
  version: "3.0"
  description: ABRM template with evidence-tier response policy.
